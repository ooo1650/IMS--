# Errors nginx itself produces answer JSON, like the backend, so the app shows
# a sentence instead of "The server answered 429". Included in each https server.
error_page 429 = @ims_rate_limited;
error_page 413 = @ims_too_large;

location @ims_rate_limited {
    default_type application/json;
    include /etc/nginx/conf.d/ims-headers.inc;
    add_header Retry-After 5 always;
    return 429 '{"detail":"Too many requests from this network. Wait a few seconds and try again.","code":"rate_limited","retry_after":5}';
}
location @ims_too_large {
    default_type application/json;
    include /etc/nginx/conf.d/ims-headers.inc;
    return 413 '{"detail":"That file is too large: 10 MB at most.","code":"too_large"}';
}

# Proxy to gunicorn. A variable makes nginx resolve "backend" at request time
# (Docker DNS) instead of once at start-up.
set $ims_backend http://backend:8000;
proxy_pass $ims_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Appends the client address; Django takes the last entry (IMS_TRUSTED_PROXIES=1, ims/net.py).
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_read_timeout 120s;  # report exports and the accountant zip can take a while

# Alternative to Caddy. Add TLS (certbot) in front of this server block.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pos:10m rate=20r/s;

server {
    listen 80;
    server_name _;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /api/v1/auth/login { limit_req zone=login burst=5 nodelay; proxy_pass http://backend:8000; include proxy_params; }
    location /api/v1/pos/        { limit_req zone=pos burst=40;          proxy_pass http://backend:8000; include proxy_params; }
    location /api/               { proxy_pass http://backend:8000; include proxy_params; }
    location /django-admin/      { proxy_pass http://backend:8000; include proxy_params; }
    location /static/            { root /srv; }
    location = /sw.js            { root /srv/spa; add_header Cache-Control "no-cache"; }
    location /                   { root /srv/spa; try_files $uri /index.html; }
}

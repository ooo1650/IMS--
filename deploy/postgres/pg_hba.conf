# IMS database access (docker-compose `db`, passed with -c hba_file=...).
# Same as the postgres image's default, plus one line so the `backup` service
# can take physical base backups (pg_basebackup) over the internal network.
# TYPE  DATABASE     USER  ADDRESS        METHOD
local   all          all                  trust
host    all          all   127.0.0.1/32   trust
host    all          all   ::1/128        trust
local   replication  all                  trust
host    replication  ims   all            scram-sha-256
host    all          all   all            scram-sha-256

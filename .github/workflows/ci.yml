# Runs on every push and pull request. The backend job uses a real Postgres so
# the append-only triggers, row locks and concurrency tests run (SQLite skips them).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ims
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ims
      DJANGO_DEBUG: "true"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt ruff==0.14.4
      - name: Lint
        run: ruff check .
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (Postgres)
        run: python manage.py test
      - name: Tests (SQLite, the dev database)
        run: python manage.py test
        env:
          DATABASE_URL: ""

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build   # tsc -b + vite build

  console:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - name: Shared files match frontend/src
        run: npm run sync-shared && git diff --exit-code -- src/shared
      - run: npm run build

  images:
    # The Docker images build (catches what only fails inside the Dockerfiles).
    runs-on: ubuntu-24.04
    needs: [backend, frontend, console]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          POSTGRES_PASSWORD: ci
          IMS_APP_DB_PASSWORD: ci
          DJANGO_SECRET_KEY: ci-only-not-secret
          IMS_DOMAIN: localhost
        run: docker compose build

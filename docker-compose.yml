# Single-VM deployment. Copy .env.example to .env, fill it in, then:
#   docker compose up -d --build
# Services: db (Postgres + WAL archive) · migrate (one-shot, DB owner) · backend
# (gunicorn, least-privilege DB role) · worker (scheduled jobs) · web (nginx:
# TLS, SPA, security headers, rate limits) · certbot (Let's Encrypt for a public
# IMS_DOMAIN) · backup (nightly dumps + weekly restore drill) · console (optional,
# profile "console": the operator console as a separate app on :8081).

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-app-env: &app-env
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${IMS_DOMAIN:?set IMS_DOMAIN in .env},localhost,127.0.0.1${IMS_CONSOLE_DOMAIN:+,}${IMS_CONSOLE_DOMAIN:-}
  # The IMS app, the operator console on :8443, and the console's own subdomain if set.
  DJANGO_CSRF_TRUSTED_ORIGINS: https://${IMS_DOMAIN},https://${IMS_DOMAIN}:8443${IMS_CONSOLE_DOMAIN:+,https://}${IMS_CONSOLE_DOMAIN:-}${IMS_CONSOLE_ORIGIN:+,}${IMS_CONSOLE_ORIGIN:-}
  IMS_TRUSTED_PROXIES: "1"
  TZ: Asia/Kathmandu
  CBMS_ENCRYPTION_KEY: ${CBMS_ENCRYPTION_KEY:-}
  # Email, sign-in rules and per-business shop rules are edited in the operator console.
  IMS_ALLOW_FONEPAY_MOCK: ${IMS_ALLOW_FONEPAY_MOCK:-false}  # FonePay mode/address/credentials are set in the app
  IMS_FONEPAY_HOSTS: ${IMS_FONEPAY_HOSTS:-fonepay.com}
  IMS_TEST_LOGIN: ${IMS_TEST_LOGIN:-false}  # testing phase only: one-click sign-in from private networks
  IMS_ALLOW_DEMO_SEED: ${IMS_ALLOW_DEMO_SEED:-false}  # console "Load demo businesses" (demo boxes only)
  # Row access only: no TRUNCATE, no DDL, can't disable the append-only triggers.
  DATABASE_URL: postgres://ims_app:${IMS_APP_DB_PASSWORD:?set IMS_APP_DB_PASSWORD in .env}@db:5432/ims

services:
  db:
    image: postgres:16.6
    <<: *hardening
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]  # the entrypoint drops to the postgres user
    environment:
      POSTGRES_DB: ims
      POSTGRES_USER: ims  # owner/superuser: migrations and backups only
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: Asia/Kathmandu
    volumes:
      - pgdata:/var/lib/postgresql/data
      - walarchive:/wal_archive
      - ./deploy/postgres/pg_hba.conf:/etc/ims/pg_hba.conf:ro
    # A new volume is root-owned and Postgres runs as "postgres": hand the WAL
    # archive over first, or every archive_command fails and pg_wal fills the disk.
    entrypoint: ["sh", "-c", "chown postgres:postgres /wal_archive && chmod 700 /wal_archive && exec docker-entrypoint.sh \"$$@\"", "--"]
    # WAL is gzipped into the archive (a quiet 16 MB segment shrinks to a few KB) and
    # archived at least every 10 minutes, so point-in-time recovery loses at most that.
    command: ["postgres", "-c", "wal_level=replica", "-c", "archive_mode=on", "-c", "archive_timeout=600",
              "-c", "archive_command=test ! -f /wal_archive/%f.gz && gzip -c %p > /wal_archive/%f.tmp && mv /wal_archive/%f.tmp /wal_archive/%f.gz",
              "-c", "hba_file=/etc/ims/pg_hba.conf",
              "-c", "password_encryption=scram-sha-256", "-c", "log_connections=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ims -d ims"]
      interval: 5s
      retries: 20
    networks: [data]

  migrate:
    build: ./backend
    image: ims-backend
    command: ["migrate"]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      <<: *app-env
      DATABASE_URL: postgres://ims:${POSTGRES_PASSWORD}@db:5432/ims
      IMS_APP_DB_PASSWORD: ${IMS_APP_DB_PASSWORD}
      # Read ONCE by the upgrade migrations to copy old .env values into the
      # database (email -> system settings, shop rules -> each business).
      # After that they're edited in the console; these lines can go.
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
      IMS_2FA_REQUIRED_ROLES: ${IMS_2FA_REQUIRED_ROLES:-SuperAdmin,OrgAdmin,BranchManager}
      IMS_CASH_ROUNDING_PAISA: ${IMS_CASH_ROUNDING_PAISA:-1}
      IMS_CASHIER_MAX_DISCOUNT_BP: ${IMS_CASHIER_MAX_DISCOUNT_BP:-500}
      IMS_RETURN_APPROVAL_THRESHOLD: ${IMS_RETURN_APPROVAL_THRESHOLD:-500000}
    depends_on:
      db: { condition: service_healthy }
    networks: [data]

  backend:
    image: ims-backend
    pull_policy: never  # built by the migrate service
    <<: *hardening
    command: ["web"]
    environment:
      <<: *app-env
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-8}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - media:/srv/media      # product photos (written by uploads)
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data, edge]

  worker:
    image: ims-backend
    pull_policy: never
    <<: *hardening
    command: ["worker"]
    environment: *app-env
    read_only: true
    tmpfs: [/tmp]
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [data, edge]

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: ims-web
    <<: *hardening
    # nginx master runs as root to bind 80/443 and read the key, workers drop to "nginx".
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    # 8443: the operator console (or IMS_CONSOLE_DOMAIN on 443).
    ports: ["80:80", "443:443", "8443:8443"]
    environment:
      IMS_DOMAIN: ${IMS_DOMAIN}
      IMS_ADMIN_ALLOW: ${IMS_ADMIN_ALLOW:-private_ranges}
      IMS_CONSOLE_ALLOW: ${IMS_CONSOLE_ALLOW:-private_ranges}
      IMS_CONSOLE_DOMAIN: ${IMS_CONSOLE_DOMAIN:-}
      IMS_CONSOLE_PROXY: ${IMS_CONSOLE_PROXY:-}   # console hosted elsewhere: its proxy's address(es)
      IMS_CSP_CONNECT_EXTRA: ${IMS_CSP_CONNECT_EXTRA:-}
    read_only: true
    tmpfs: [/tmp, /run, /var/cache/nginx, /etc/nginx/conf.d, /etc/nginx/runtime]
    volumes:
      - letsencrypt:/etc/letsencrypt:ro   # certificates from the certbot service
      - acme:/var/www/certbot:ro          # Let's Encrypt challenge files
      - media:/srv/media:ro               # serves /media/ (product photos)
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 30s
      retries: 3
    depends_on:
      backend: { condition: service_healthy }
    networks: [edge]

  certbot:
    image: certbot/certbot:v4.0.0
    <<: *hardening
    entrypoint: ["/deploy/certbot-loop.sh"]
    environment:
      IMS_DOMAIN: ${IMS_DOMAIN}
      IMS_CONSOLE_DOMAIN: ${IMS_CONSOLE_DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    read_only: true
    tmpfs: [/tmp, /var/log/letsencrypt, /var/lib/letsencrypt]
    volumes:
      - ./deploy:/deploy:ro
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/certbot
    depends_on:
      web: { condition: service_started }
    networks: [edge]

  backup:
    image: postgres:16.6
    <<: *hardening
    cap_add: [DAC_OVERRIDE, FOWNER]  # prune the WAL archive, which belongs to the db's "postgres" user
    entrypoint: ["/deploy/backup-loop.sh"]
    environment:
      DATABASE_URL: postgres://ims:${POSTGRES_PASSWORD}@db:5432/ims
      ADMIN_URL: postgres://ims:${POSTGRES_PASSWORD}@db:5432/postgres
      BACKUP_DIR: /srv/ims-backups
      MEDIA_DIR: /srv/media
      WAL_ARCHIVE: /wal_archive
      # Encrypt every dump and base backup (gpg, AES-256). Keep this passphrase
      # somewhere other than this server: without it the backups can't be read.
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      # Off-site copy: mount a disk or network share here in a compose override
      # (docs/DEPLOYMENT.md, "Backups"); empty = no copy.
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
      TZ: Asia/Kathmandu
    volumes:
      - ./deploy:/deploy:ro
      - backups:/srv/ims-backups
      - media:/srv/media:ro
      - walarchive:/wal_archive
    depends_on:
      db: { condition: service_healthy }
    networks: [data]

  # OPTIONAL: the operator console as a SEPARATE app (the way console/ is hosted
  # on another server), for trying that setup locally:
  #   docker compose --profile console up -d --build   -> http://localhost:8081
  # It talks to the IMS console endpoint (web:8443) like a remote console would.
  # Normally not needed: `web` already serves the console on :8443.
  # To sign in through it, add IMS_CONSOLE_ORIGIN=http://localhost:8081 to .env.
  console:
    build: ./console
    image: ims-console
    profiles: ["console"]
    <<: *hardening
    cap_add: [CHOWN, SETUID, SETGID]
    environment:
      IMS_API_URL: https://web:8443
      IMS_API_HOST: localhost        # a name the backend allows (DJANGO_ALLOWED_HOSTS)
    ports: ["${IMS_CONSOLE_STANDALONE_PORT:-8081}:8080"]
    read_only: true
    tmpfs: [/tmp, /run, /var/cache/nginx, /etc/nginx/conf.d]
    depends_on:
      web: { condition: service_healthy }
    networks: [edge]

networks:
  data:
    internal: true  # database: no internet, not published
  edge: {}

volumes:
  pgdata:
  walarchive:
  backups:
  letsencrypt:
  acme:
  media:
